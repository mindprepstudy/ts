<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D45">
<meta name="description" content="Classroom screen with timers, schedules, hall passes and more.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Teacher Screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Merriweather:wght@400;700&family=Orbitron:wght@500;700&family=Patrick+Hand&display=swap">
<style>
:root{
  --card:#FBFAF4; --card-2:#EFEDE2; --ink:#1C2B2A; --ink-soft:#56655F; --line:#D6D3C4;
  --tray:#FBFAF4; --tray-edge:#C9A66B;
  --accent:#2F6FE4; --accent-ink:#FFFFFF;
  --ok:#1E9E6A; --warn:#E0A200; --hot:#E5484D;
  --shadow:0 10px 30px rgba(12,30,28,.28), 0 2px 6px rgba(12,30,28,.18);
  --display:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --card:#22302E; --card-2:#2C3D3A; --ink:#F3F1E6; --ink-soft:#A9B6B0; --line:#3D504C;
    --tray:#1B2625; --tray-edge:#7A6034;
    --accent:#6C9BFF; --accent-ink:#0E1A2E;
    --ok:#3CC48B; --warn:#F5B81F; --hot:#FF6B6F;
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --card:#22302E; --card-2:#2C3D3A; --ink:#F3F1E6; --ink-soft:#A9B6B0; --line:#3D504C;
  --tray:#1B2625; --tray-edge:#7A6034;
  --accent:#6C9BFF; --accent-ink:#0E1A2E;
  --ok:#3CC48B; --warn:#F5B81F; --hot:#FF6B6F;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#1F4D45;color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[contenteditable]:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- board ---------- */
#board{--ui-ink:var(--ink);--ui-soft:var(--ink-soft);--ui-display:var(--display);--ui-body:var(--body);position:relative;flex:1;min-height:0;overflow:hidden;background-size:cover;background-position:center;touch-action:none}
#empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:var(--card);color:var(--ink);padding:.9rem 1.4rem;border-radius:999px;font-family:var(--display);font-weight:500;font-size:1.15rem;box-shadow:var(--shadow);text-align:center;max-width:90%}
#empty[hidden]{display:none}

/* ---------- widget frame ---------- */
.w{position:absolute;display:flex;flex-direction:column;color:var(--ink);font-family:var(--body);background:var(--card);border-radius:18px;box-shadow:var(--shadow);min-width:150px;min-height:120px;overflow:hidden}
.w-head{display:flex;align-items:center;gap:.25rem;padding:.3rem .35rem .3rem .8rem;background:var(--card-2);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.w.locked .w-head{cursor:default}
.w-title{flex:1;font-family:var(--display);font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-btn{border:0;background:transparent;width:1.8rem;height:1.8rem;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--ink-soft)}
.w-btn:hover{background:var(--line);color:var(--ink)}
.w-btn svg{width:1.1rem;height:1.1rem}
.w.locked .w-btn.lock{color:var(--accent)}
.w-body{flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;font-size:calc(1rem*var(--fs,1))}
.w :is(.w-head,.row,.slide){--ink:var(--ui-ink);--ink-soft:var(--ui-soft);--display:var(--ui-display);--body:var(--ui-body);color:var(--ink);font-family:var(--body);font-size:1rem}
.style-row[hidden]{display:none}
.tx-row{position:absolute;left:.4rem;right:.4rem;bottom:.4rem;z-index:5;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);animation:pop .14s ease-out}
.w:not(:focus-within) .tx-row{display:none}
.w[data-skin="glass"] .tx-row{background:#F7F7F3}
.w.clear .tx-row{background:rgba(20,32,30,.94);opacity:1!important;pointer-events:auto!important}
#board[data-tone="light"] .w.clear .tx-row{background:rgba(255,255,255,.96)}
.style-br{flex-basis:100%;height:0}
.style-row{position:absolute;left:.4rem;right:.4rem;top:2.5rem;z-index:6;justify-content:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:calc(100% - 3rem);overflow:auto;animation:pop .14s ease-out}
.w[data-skin="glass"] .style-row{background:#F7F7F3}
.w.clear .style-row{background:rgba(20,32,30,.94)}
#board[data-tone="light"] .w.clear .style-row{background:rgba(255,255,255,.96)}
.w.tinted .lk a{background:transparent;border:4px solid var(--ink);color:var(--ink);text-shadow:inherit}
.w-grip{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;background:
  linear-gradient(135deg,transparent 50%,var(--ink-soft) 50% 56%,transparent 56% 68%,var(--ink-soft) 68% 74%,transparent 74% 86%,var(--ink-soft) 86% 92%,transparent 92%);opacity:.55;border-bottom-right-radius:18px}
.w.locked .w-grip{display:none}

.row{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;align-items:center;padding:.45rem .6rem}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .75rem;font-weight:700;font-size:.9rem;min-height:2.1rem}
.chip:hover{border-color:var(--ink-soft)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding-inline:1.1rem}

/* ---------- timer ---------- */
.t-face{flex:1;min-height:0;position:relative;display:grid;place-items:center;container-type:size}
.t-face svg{position:absolute;inset:4%;width:92%;height:92%}
.t-track{fill:none;stroke:var(--card-2);stroke-width:9}
.t-arc{fill:none;stroke:var(--tone);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear,stroke .3s}
.t-time{position:relative;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;font-size:27cqmin;color:var(--ink)}
.timer{--tone:var(--ok)}
.timer.warn{--tone:var(--warn)}
.timer.hot{--tone:var(--hot)}
.t-pie{fill:none;stroke:var(--tone);stroke-width:44;transform:rotate(-90deg);transform-origin:50% 50%;display:none}
.timer.pie .t-pie{display:block}.timer.pie .t-arc{display:none}
.timer.pie .t-track{fill:var(--card-2);stroke:var(--line);stroke-width:1.5}
.timer.pie .t-time{font-size:15cqmin;background:var(--card);border-radius:999px;padding:.12em .4em;text-shadow:none}
.w.clear .timer.pie .t-time{background:rgba(10,24,22,.55);color:#fff}
.timer.digital .t-face svg{display:none}
.timer.digital .t-face{margin:.6rem .6rem 0;border-radius:14px;background:#10201E}
.timer.digital .t-time{color:var(--tone);font-size:min(30cqw,62cqh);letter-spacing:.02em}
.timer.over .t-time{font-size:13cqmin;color:var(--hot);text-align:center}
.timer.digital.over .t-time{font-size:min(15cqw,40cqh)}
.timer.over .t-face{animation:flash 1s steps(2,jump-none) infinite}
@keyframes flash{50%{background:color-mix(in srgb,var(--hot) 22%,transparent)}}
@media (prefers-reduced-motion:reduce){.timer.over .t-face{animation:none}.t-arc{transition:none}}

/* ---------- clock ---------- */
.clock{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;padding:3cqh 3cqw}
.c-time{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;font-size:calc(min(17cqw,42cqh)*var(--fs,1));white-space:nowrap}
.c-date{font-size:calc(min(6.5cqw,11cqh)*var(--fs,1));color:var(--ink-soft);text-align:center}
.c-analog{flex:1;min-height:0;aspect-ratio:1;max-width:100%}
.c-analog .rim{fill:var(--card-2);stroke:var(--ink);stroke-width:3}
.c-analog .tick{stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round}
.c-analog .hand{stroke:var(--ink);stroke-linecap:round}
.c-analog .sec{stroke:var(--hot);stroke-width:1.5;stroke-linecap:round}

/* ---------- text ---------- */
.note{flex:1;min-height:0;overflow:auto;padding:.7rem .9rem;line-height:1.35;font-family:var(--body);outline-offset:-3px;white-space:pre-wrap;overflow-wrap:anywhere}
.note:empty::before{content:attr(data-ph);color:var(--ink-soft)}

/* ---------- name picker ---------- */
.np-stage{flex:1;min-height:0;display:grid;place-items:center;padding:2cqh 4cqw;text-align:center}
.np-name{font-family:var(--display);font-weight:700;line-height:1.05;font-size:calc(min(15cqw,30cqh)*var(--fs,1));overflow-wrap:anywhere}
.np-name.hint{font-family:var(--body);font-weight:400;font-size:min(6cqw,12cqh);color:var(--ink-soft)}
.np-name.landed{color:var(--accent)}
.np-count{font-size:.85rem;color:var(--ink-soft)}
.np-edit{flex:1;min-height:0;margin:.6rem .6rem 0;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:.6rem .7rem;resize:none}

/* ---------- see-through ---------- */
#bgv,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bgv{object-fit:cover}#bgv[hidden]{display:none}
#board.bg-aurora{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 30%}to{background-position:100% 70%}}
@media (prefers-reduced-motion:reduce){#board.bg-aurora{animation:none}}
.w.clear{background:transparent;box-shadow:none;--card:rgba(10,24,22,.34);--card-2:rgba(10,24,22,.34);--line:rgba(255,255,255,.45);--ink:#FFFFFF;--ink-soft:rgba(255,255,255,.82);--ui-ink:#FFFFFF;--ui-soft:rgba(255,255,255,.82);text-shadow:0 1px 4px rgba(0,0,0,.6)}
#board[data-tone="light"] .w.clear{--card:rgba(255,255,255,.5);--card-2:rgba(255,255,255,.5);--line:rgba(28,43,42,.4);--ink:#1C2B2A;--ink-soft:#3C4A47;--ui-ink:#1C2B2A;--ui-soft:#3C4A47;text-shadow:none}
.w.clear .chip.on{color:#1C2B2A;text-shadow:none}
#board[data-tone="light"] .w.clear .chip.on{color:#FFFFFF}
.w.clear .chip.go{text-shadow:none}
.w.clear .w-head{background:transparent}
.w.clear .w-head,.w.clear .row,.w.clear .slide,.w.clear .w-grip{transition:opacity .15s}
.w.clear:not(:hover):not(.peek):not(:has(:focus-visible)) :is(.w-head,.row,.slide,.w-grip){opacity:0;pointer-events:none}
.w.clear .w-btn.see{color:var(--accent)}
.inp{border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:.45rem .6rem;min-width:0}
.col{display:flex;flex-direction:column;gap:.5rem;padding:.7rem}
.hint{flex:1;display:grid;place-items:center;text-align:center;color:var(--ink-soft);padding:1rem}

/* ---------- stopwatch / countdown ---------- */
.big{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2cqh 3cqw;gap:1cqh}
.big-n{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;font-size:calc(min(22cqw,50cqh)*var(--fs,1))}
.big-l{font-size:calc(min(6cqw,10cqh)*var(--fs,1));color:var(--ink-soft);overflow-wrap:anywhere}

/* ---------- calendar ---------- */
.cal{flex:1;min-height:0;display:flex;flex-direction:column;padding:.4rem .6rem .6rem}
.cal-top{display:flex;align-items:center;gap:.3rem}
.cal-top strong{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:min(6cqw,9cqh)}
.cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;text-align:center;font-size:calc(min(4.6cqw,6.4cqh)*var(--fs,1));font-variant-numeric:tabular-nums}
.cal-grid span{display:grid;place-items:center}
.cal-grid .dow{color:var(--ink-soft);font-weight:700;font-size:.8em}
.cal-day{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.5cqh;padding:2cqh 4cqw;font-size:calc(1rem*var(--fs,1))}
.cd-wd{font-size:calc(min(8cqw,9cqh)*var(--fs,1));color:var(--ink-soft);font-weight:700}
.cd-date{font-family:var(--display);font-weight:700;line-height:1.05;font-size:calc(min(14cqw,17cqh)*var(--fs,1))}
.cd-time{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;font-size:calc(min(11cqw,14cqh)*var(--fs,1))}
.cal-day .cd-tag{font-family:var(--display);font-weight:700;line-height:1.05;font-size:calc(min(10cqw,12cqh)*var(--fs,1));padding:0;border-radius:0;background:none;color:var(--ink);text-shadow:inherit}
.cal-day .cd-tag[hidden]{display:none}
.cal-grid .now b{display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-shadow:none}

/* ---------- draw ---------- */
.dr{flex:1;min-height:0;width:100%;touch-action:none;cursor:crosshair;display:block}
.pen{width:1.9rem;height:1.9rem;border-radius:50%;border:3px solid var(--line);padding:0;background:var(--pc)}
input.wide{flex:1;min-width:5rem;accent-color:var(--accent)}
.pen.auto{background:linear-gradient(135deg,#1C2B2A 50%,#FFFFFF 50%)}
.pen.on{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}

/* ---------- picture / camera ---------- */
.pic{flex:1;min-height:0;width:100%;object-fit:contain;display:block}
.cam{flex:1;min-height:0;width:100%;object-fit:cover;display:block;background:#10201E}
.cam.flip{transform:scaleX(-1)}

/* ---------- link ---------- */
.lk{flex:1;min-height:0;display:grid;place-items:center;padding:4cqh 5cqw}
.lk a{display:grid;place-items:center;width:100%;height:100%;border-radius:16px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-family:var(--display);font-weight:700;font-size:calc(min(11cqw,26cqh)*var(--fs,1));text-align:center;padding:.3em;overflow-wrap:anywhere;text-shadow:none}

/* ---------- poll ---------- */
.pl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.45rem;padding:.7rem}
.pl-q{font-family:var(--display);font-weight:600;font-size:1.3em;margin:0 0 .2rem}
.pl-opt{position:relative;display:flex;justify-content:space-between;gap:1rem;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:.6rem .8rem;font-size:1.15em;font-weight:700;overflow:hidden;color:var(--ink);font-family:inherit}
.pl-opt::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:color-mix(in srgb,var(--accent) 30%,transparent);transition:width .25s}
.pl-opt span{position:relative}
.pl-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.pl-thanks{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);font-family:var(--display);font-weight:700;font-size:calc(min(12cqw,14cqh)*var(--fs,1));color:var(--ok);animation:pop .15s ease-out;border-radius:12px}
.pl-thanks[hidden]{display:none}

/* ---------- QR ---------- */
.qr{flex:1;min-height:0;display:grid;place-items:center;padding:.6rem}
.qr svg{height:100%;width:100%;max-height:100%;background:#FFFFFF;border-radius:10px}

/* ---------- scoreboard ---------- */
.sb{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.6rem;padding:.7rem}
.sb-team{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-top:6px solid var(--gc);background:var(--card-2);border-radius:12px;padding:.4rem}
.sb-team input{width:100%;border:0;background:transparent;color:var(--ink);text-align:center;font-family:var(--display);font-weight:600;font-size:1.05rem;text-shadow:inherit}
.sb-score{font-family:var(--display);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;font-size:min(calc(46cqw / var(--n)),38cqh)}

/* ---------- sticker ---------- */
.stk{flex:1;min-height:0;display:grid;place-items:center;font-size:min(70cqw,62cqh);line-height:1;text-shadow:none}
.stk-row{max-height:5.2rem;overflow:auto}.stk-row[hidden]{display:none}
.stk-row .chip{font-size:1.2rem;padding:.2rem .5rem}

/* ---------- lesson plan / stop & go ---------- */
.ag{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.35rem;padding:.7rem}
.ag-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;border-radius:12px;background:var(--card-2);font-size:1.15em;flex:none;flex-wrap:wrap;row-gap:.1rem}
.ag-row>*{position:relative}
.ag-row.past{opacity:.8}

.ag-row.cur{outline:3px solid var(--accent);outline-offset:-3px;font-weight:700}
.ag-row.cur::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:color-mix(in srgb,var(--accent) 26%,transparent)}
.ag-t{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);font-weight:700}
.ag-row.cur .ag-t{color:var(--ink)}
.ag-n{flex:1 1 5em;min-width:0;overflow-wrap:break-word}
.ag-left{white-space:nowrap;font-size:.85em}
.ag-ic{width:1.7em;height:1.7em;flex:none}
.sg-top{flex:none;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.6rem .7rem 0;text-align:center}
.sg-top svg{height:min(34cqh,46cqw);aspect-ratio:1}
.sg-title{font-family:var(--display);font-weight:600;font-size:1.15em}
.sg-cap{font-family:var(--display);font-weight:700;font-size:calc(min(7.5cqw,7cqh)*var(--fs,1));line-height:1.1}
.sg-sub{color:var(--ink-soft);font-size:1em}
.re{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.4rem;padding:.7rem}
.re-row{display:flex;gap:.3rem;align-items:center}
.re-row input[type=time]{width:8.8rem;flex:none;padding-inline:.4rem}
.re-row{flex-wrap:wrap}.re-row input[type=text]{min-width:4.5rem}
.re-row input[type=text]{flex:1}
.re-row .chip{flex:none}

/* ---------- groups ---------- */
.g-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;padding:.7rem;align-content:start}
.g-card{border-radius:12px;background:var(--card-2);border-top:6px solid var(--gc);padding:.5rem .7rem .6rem}
.g-card h3{margin:0 0 .25rem;font-family:var(--display);font-weight:600;font-size:1.05em}
.g-card ul{margin:0;padding:0;list-style:none;font-size:1.15em;line-height:1.35;overflow-wrap:anywhere}
.g-hint{flex:1;display:grid;place-items:center;text-align:center;color:var(--ink-soft);padding:1rem}
.g-n{font-weight:700;min-width:5.5rem;text-align:center}

/* ---------- sound level ---------- */
.nz{flex:1;min-height:0;display:flex;flex-direction:column}
.nz-bars{flex:1;min-height:0;display:flex;flex-direction:column-reverse;gap:3%;padding:.7rem 22% .3rem;position:relative}
.nz-bar{flex:1;border-radius:6px;background:var(--card-2)}
.nz-bar.cap{box-shadow:0 -3px 0 var(--ink)}
.nz-bar.on.lo{background:var(--ok)}.nz-bar.on.mid{background:var(--warn)}.nz-bar.on.hi{background:var(--hot)}
.nz-msg{min-height:1.6rem;text-align:center;font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--hot);padding:0 .6rem}
.nz-msg.note{font-family:var(--body);font-weight:400;font-size:.9rem;color:var(--ink-soft)}
.nz.loud{background:color-mix(in srgb,var(--hot) 16%,transparent)}
.slide{display:flex;align-items:center;gap:.5rem;padding:.15rem .9rem;font-size:.85rem;font-weight:700}
.slide span{min-width:5.2rem}
.slide input{flex:1;min-width:0;accent-color:var(--accent)}

/* ---------- work mode ---------- */
.wm{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;background:color-mix(in srgb,var(--mc) 20%,var(--card));text-align:center;padding:2cqh 3cqw}
.wm-icon{font-size:min(38cqw,42cqh);line-height:1}
.wm-label{font-family:var(--display);font-weight:700;font-size:calc(min(10cqw,13cqh)*var(--fs,1));line-height:1.05}

/* ---------- dice ---------- */
.dice{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4cqw;padding:3cqh 4cqw}
.dice svg{height:min(78cqh,calc(84cqw / var(--n)));aspect-ratio:1;flex:none}
.dice rect{fill:#FFFFFF;stroke:#1C2B2A;stroke-width:3}
.dice circle{fill:#1C2B2A}

/* ---------- traffic light ---------- */
.tl{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;padding:3cqh 4cqw}
.tl-box{background:#1C2B2A;border-radius:999px;padding:3cqh;display:flex;flex-direction:column;gap:3cqh;align-items:center}
.tl-lamp{width:min(21cqh,56cqw);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--lc);opacity:.18}
.tl-lamp.on{opacity:1;box-shadow:0 0 6cqh color-mix(in srgb,var(--lc) 70%,transparent)}
.tl-label{font-family:var(--display);font-weight:700;font-size:min(13cqw,8cqh)}

/* ---------- tray ---------- */
#dock{position:fixed;left:50%;bottom:calc(.8rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9000;display:flex;flex-direction:column;align-items:center;gap:.55rem;width:max-content;max-width:calc(100vw - 1rem)}
#tray{display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;background:var(--tray);border-radius:22px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%;transform-origin:50% 100%;animation:pop .16s ease-out}
#dock:not(.open) #tray{display:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#tray{animation:none}}
#menu-btn{width:3.4rem;height:3.4rem;border-radius:50%;border:0;display:grid;place-items:center;background:var(--tray);color:var(--ink);box-shadow:var(--shadow);opacity:.6;transition:opacity .15s,transform .15s}
#menu-btn:hover,#menu-btn:focus-visible,#dock.open #menu-btn{opacity:1}
#menu-btn:active{transform:scale(.94)}
#menu-btn svg{width:1.6rem;height:1.6rem}
#tray .gap{flex:1;min-width:.5rem}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:.15rem;min-width:4.6rem;padding:.4rem .55rem;border:0;border-radius:14px;background:transparent;font-size:.8rem;font-weight:700;color:var(--ink)}
.tool:hover{background:var(--card-2)}
.tool svg{width:1.75rem;height:1.75rem}
.tool .dot{width:.6rem;height:.6rem;border-radius:50%;margin-top:-.1rem}
.tool[data-c="timer"] svg{color:#E5484D}.tool[data-c="clock"] svg{color:#2F6FE4}
.tool[data-c="calendar"] svg,.tool[data-c="link"] svg,.tool[data-c="poll"] svg{color:#2F6FE4}.tool[data-c="draw"] svg,.tool[data-c="sticker"] svg{color:#E0A200}.tool[data-c="countdown"] svg,.tool[data-c="stopwatch"] svg{color:#E5484D}.tool[data-c="image"] svg,.tool[data-c="score"] svg{color:#1E9E6A}.tool[data-c="qr"] svg,.tool[data-c="webcam"] svg{color:#7A52C7}
.tool[data-c="pass"] svg{color:#1E9E6A}.tool[data-c="wheel"] svg{color:#F2762E}
.wh{flex:1;min-height:0;display:flex;flex-direction:column;gap:.4rem;padding:.6rem .7rem 0}
.wh-stage{position:relative;flex:1;min-height:0}
.wh-cv{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.wh-stage .hint{position:absolute;inset:0}
.wh-res{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:92%;background:var(--card);color:var(--ink);border-radius:18px;padding:.3em .7em;box-shadow:var(--shadow);font-family:var(--display);font-weight:700;text-align:center;line-height:1.1;overflow-wrap:anywhere;font-size:calc(min(12cqw,11cqh)*var(--fs,1));animation:pop .2s ease-out;cursor:pointer;text-shadow:none}
.wh-res[hidden]{display:none}
.ps{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.45rem;padding:.7rem}
.ps-top select{width:100%;font-weight:700}
.ps-row{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;padding:.5rem .6rem;border-radius:12px;background:var(--card-2);font-size:1.1em;flex:none}
.ps-name{flex:1 1 4em;min-width:0;font-weight:700;overflow-wrap:anywhere}
.ps-who{flex:1 1 9em;min-width:0}.ps-place{flex:0 1 9em;min-width:0}
.ps-time{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.5em;min-width:3.4ch;text-align:right;color:var(--ok)}
.ps-time.warn{color:var(--warn)}.ps-time.hot{color:var(--hot)}
.ps-new{background:transparent;border:1.5px dashed var(--line)}
.ps-full{text-align:center;color:var(--ink-soft);font-weight:700;padding:.3rem}
.ps-edit{display:flex;flex-direction:column;gap:.4rem;padding:.6rem;border-radius:12px;background:var(--card-2);flex:none}
.ps-log{font-size:1em}.ps-t,.ps-dur{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.w.clear select option{color:#1C2B2A;background:#FFFFFF}
.tool[data-c="plan"] svg{color:#2F6FE4}.tool[data-c="signs"] svg{color:#E5484D}
.tool[data-c="groups"] svg{color:#C2477E}.tool[data-c="noise"] svg{color:#E5484D}.tool[data-c="symbols"] svg{color:#2F6FE4}.tool[data-c="dice"] svg{color:#7A52C7}.tool[data-c="light"] svg{color:#1E9E6A}
.tool[data-c="text"] svg{color:#E0A200}.tool[data-c="names"] svg{color:#1E9E6A}

/* ---------- screens nav ---------- */
#scr{flex:none;display:flex;align-items:center;gap:.2rem;padding:.2rem;border-radius:16px;background:var(--card-2);margin-left:.4rem}
#scr .w-btn{width:2.4rem;height:2.6rem;font-size:1.6rem;color:var(--ink)}
#scr-name{border:0;background:var(--card);border-radius:12px;min-width:9rem;max-width:16rem;padding:.35rem .8rem;display:flex;flex-direction:column;align-items:center;line-height:1.15}
#scr-name b{font-family:var(--display);font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#scr-name small{font-size:.78rem;color:var(--ink-soft);white-space:nowrap}
.daytag{display:inline-block;border-radius:6px;padding:0 .35em;font-weight:700;color:#FFFFFF}
.panel.mid{right:auto;left:50%;transform:translateX(-50%);width:min(30rem,calc(100vw - 1.4rem));max-height:72vh;overflow:auto}
#tpl-list{margin-top:.6rem;border-top:1.5px solid var(--line);padding-top:.2rem}
#tpl-list[hidden]{display:none}
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem;margin-top:.4rem}
.tpl-card{width:100%;height:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:.55rem .65rem;display:flex;flex-direction:column;gap:.15rem}
.tpl-card:hover{border-color:var(--accent)}
.tpl-card b{font-family:var(--display);font-weight:600}
.tpl-card span{font-size:.8rem;color:var(--ink-soft);line-height:1.3}
.tpl-mine{position:relative}
.scr-row{display:flex;align-items:center;gap:.25rem;border-radius:10px;padding:.15rem .25rem}
.scr-row.on{background:var(--card-2)}
.scr-row .inp{flex:1}
.scr-row .go{flex:none;border:0;background:transparent;font-weight:700;padding:.4rem .5rem;border-radius:8px;color:var(--accent)}
.panel-foot{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.w.pinned .w-btn.pin{color:var(--accent)}
#sched{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;background:rgba(8,20,18,.55);padding:1rem}
#sched[hidden]{display:none}
.sd{background:var(--card);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);width:min(64rem,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sd-head{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.sd-head h2{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:1.35rem}
.sd-tabs{display:flex;gap:.3rem;padding:.6rem 1rem 0;flex-wrap:wrap}
.sd-body{flex:1;min-height:0;overflow:auto;padding:1rem}
.sd-note{color:var(--ink-soft);margin:.2rem 0 .8rem;max-width:60ch;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-bottom:.8rem;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:1.1rem;height:1.1rem;border-radius:5px;display:inline-block}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:1rem}
.mon h3{margin:0 0 .3rem;font-family:var(--display);font-weight:600;font-size:1rem}
.mon-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.78rem;text-align:center}
.mon-g .dw{color:var(--ink-soft);font-weight:700;padding:.15rem 0}
.dy{border:0;border-radius:6px;padding:.3rem 0;background:var(--card-2);color:var(--ink);font-variant-numeric:tabular-nums;font-size:.8rem;line-height:1.1}
.dy.we{background:transparent;color:var(--ink-soft)}
.dy.A,.dy.B,.dy.S{color:#FFFFFF;font-weight:700}
.dy.today{outline:2.5px solid var(--ink);outline-offset:1px}
.fill{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end;padding:.8rem;border-radius:14px;background:var(--card-2);margin-bottom:1rem}
.fill label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;font-weight:700}
.fill label.switch{flex-direction:row;font-size:.95rem;margin-right:.4rem}
.bell{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:.4rem}
.bell input[type=time]{width:8.8rem;padding-inline:.4rem}
.bell input[type=text]{flex:1;min-width:7rem}
.bell select{min-width:9rem;flex:1}
.chip.dA.on,.chip.dB.on,.chip.dS.on{color:#FFFFFF;border-color:transparent}
.chip.dA.on{background:#2F6FE4}.chip.dB.on{background:#E8730C}.chip.dS.on{background:#1E9E6A}
.switch{display:flex;align-items:center;gap:.5rem;font-weight:700;cursor:pointer}
.switch input{width:1.2rem;height:1.2rem;accent-color:var(--accent)}

/* ---------- tool styles ---------- */
.w[data-skin="glass"]:not(.clear){--card:rgba(255,255,255,.74);--card-2:rgba(255,255,255,.55);--line:rgba(28,43,42,.2);background:var(--card);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.7);border-radius:24px;box-shadow:0 14px 36px rgba(8,20,18,.3)}
.w[data-skin="glass"]:not(.clear) .w-head{background:transparent;padding-top:.5rem}
.w[data-skin="glass"]:not(.clear) .w-title{font-size:.85rem;font-weight:500;color:var(--ink-soft)}
.w[data-skin="glass"]:not(.clear) .w-grip{border-bottom-right-radius:24px}
.w[data-skin="bold"]:not(.clear){--card:#FFFFFF;--card-2:#F1F2F4;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.2),0 16px 32px rgba(8,20,18,.28)}
.w[data-skin="bold"]:not(.clear) .w-head{background:var(--tc,#2F6FE4);--ink:#FFFFFF;--ink-soft:rgba(255,255,255,.85);--ui-ink:#FFFFFF;--ui-soft:rgba(255,255,255,.85);padding:.4rem .4rem .4rem .9rem}
.w[data-skin="bold"]:not(.clear) .w-title{font-size:1rem;font-weight:700}
.w[data-skin="bold"]:not(.clear) .w-btn:hover{background:rgba(255,255,255,.22);color:#FFFFFF}
.w.pinned[data-skin="bold"]:not(.clear) .w-btn.pin,.w.locked[data-skin="bold"]:not(.clear) .w-btn.lock{color:#FFFFFF;background:rgba(255,255,255,.22)}
.w[data-skin="dark"]:not(.clear){--card:#1E2A2D;--card-2:#28373A;--ink:#F3F1E6;--ink-soft:#A9B6B0;--line:#3D504C;--ui-ink:#F3F1E6;--ui-soft:#A9B6B0;--accent:#6C9BFF;--accent-ink:#0E1A2E;border:1px solid #34474B;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.menu-sec{padding:.4rem .7rem .7rem;border-bottom:1.5px solid var(--line);margin-bottom:.3rem}
.menu-sec>span{display:block;font-weight:700;margin-bottom:.4rem}
.skin-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.skin-b{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:.35rem .2rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.78rem;font-weight:700}
.skin-b.on{border-color:var(--accent)}
.skin-b i{display:block;width:100%;height:1.9rem;border-radius:7px;overflow:hidden;position:relative}
.skin-b i::before{content:"";position:absolute;inset:0 0 auto;height:.55rem}

/* ---------- panels ---------- */
.panel{position:absolute;right:.7rem;bottom:calc(100% + .6rem);z-index:9000;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:.8rem;width:min(22rem,calc(100vw - 1.4rem))}
.panel[hidden]{display:none}
.panel.left{right:auto;left:.7rem;width:min(31rem,calc(100vw - 1.4rem));max-height:70vh;overflow:auto}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr));gap:.3rem}
.sw{position:relative}.sw.anim::after{content:"▶";position:absolute;right:4px;bottom:2px;color:#fff;font-size:.8rem;text-shadow:0 1px 3px #000}
.tool-grid .tool{min-width:0}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem .45rem;margin-bottom:.7rem;align-items:start}
#panel-bg{width:min(27rem,calc(100vw - 1.4rem));max-height:72vh;overflow:auto}
.sw-h{grid-column:1/-1;margin:.4rem 0 0;font-family:var(--display);font-weight:600;font-size:.95rem}
.sw-cell{display:flex;flex-direction:column;align-items:center;gap:.15rem;min-width:0}
.sw-cell .sw{width:100%}
.sw-note{grid-column:1/-1;font-size:.8rem;color:var(--ink-soft);margin:-.1rem 0 .3rem 1.7rem;line-height:1.3}
.sw-mine{position:relative}
.sw-del{position:absolute;top:-6px;right:-6px;width:1.5rem;height:1.5rem;border-radius:50%;border:0;display:grid;place-items:center;background:var(--ink);color:var(--card);padding:0}
.sw-del svg{width:.85rem;height:.85rem}
.sw-cap{font-size:.72rem;font-weight:700;text-align:center;line-height:1.1;color:var(--ink-soft)}
.sw{aspect-ratio:4/3;border-radius:10px;border:3px solid transparent;background-size:cover;background-position:center;padding:0}
.sw.on{border-color:var(--accent)}
.menu-item{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;background:transparent;padding:.6rem .7rem;border-radius:10px;font-weight:700}
.menu-item:hover{background:var(--card-2)}
.lang-row{justify-content:space-between}.lang-row select{width:auto;font-weight:700}
.menu-sep{height:1.5px;background:var(--line);margin:.3rem .7rem}
.menu-note{margin:0 .7rem .4rem;font-size:.78rem;color:var(--ink-soft);line-height:1.35}
.menu-item.danger{color:var(--hot)}
.file-btn{display:block;text-align:center;border:1.5px dashed var(--ink-soft);border-radius:12px;padding:.65rem;font-weight:700;cursor:pointer}
.file-btn:hover{background:var(--card-2)}
.file-btn input,.menu-item input{position:absolute;width:1px;height:1px;opacity:0}
label.menu-item{cursor:pointer}
#toast{position:fixed;left:50%;top:calc(1rem + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9999;background:var(--ink);color:var(--card);padding:.6rem 1.1rem;border-radius:999px;font-weight:700;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast[hidden]{display:none}
</style>
</head>
<body>
<main id="board" aria-label="Board"><video id="bgv" muted loop playsinline hidden></video><canvas id="fx"></canvas><p id="empty"></p></main>

<div id="dock">
<nav id="tray" aria-label="Tools">
  <div id="tools" style="display:flex;gap:.4rem"></div>
  <button class="tool" id="btn-tools"></button>
  <span class="gap"></span>
  <div id="scr"><button class="w-btn" id="scr-prev" type="button">‹</button><button id="scr-name" type="button"><b></b><small></small></button><button class="w-btn" id="scr-next" type="button">›</button></div>
  <span class="gap"></span>
  <button class="tool" id="btn-tpl"></button>
  <button class="tool" id="btn-bg"></button>
  <button class="tool" id="btn-full"></button>
  <button class="tool" id="btn-more"></button>
</nav>
  <button id="menu-btn" type="button" aria-expanded="false" aria-controls="tray"></button>
  <div class="panel left" id="panel-tools" hidden><div class="tool-grid" id="more-tools"></div></div>
  <div class="panel mid" id="panel-scr" hidden><div id="scr-list"></div><div class="panel-foot"><button class="chip go" id="scr-new" type="button"></button><button class="chip" id="scr-dup" type="button"></button><button class="chip" id="scr-sched" type="button"></button><button class="chip" id="scr-tpl" type="button"></button><button class="chip" id="scr-savetpl" type="button"></button></div><div id="tpl-list" hidden></div></div>
  <div class="panel" id="panel-bg" hidden>
    <div class="swatches" id="swatches"></div>
    <label class="file-btn"><input type="file" id="bg-file" accept="image/*,video/*"><span id="lbl-upload"></span></label>
  </div>
  <div class="panel" id="panel-more" hidden>
    <div class="menu-sec"><span id="lbl-skin"></span><div class="skin-row" id="skin-row"></div></div>
    <label class="menu-item lang-row"><span id="lbl-lang"></span><select class="inp" id="lang-sel"></select></label>
    <button class="menu-item" id="mi-backup"></button>
    <label class="menu-item"><input type="file" id="restore-file" accept=".zip,.json,application/zip,application/json"><span id="lbl-restore"></span></label>
    <div class="menu-sep"></div>
    <button class="menu-item" id="mi-school-out"></button>
    <label class="menu-item"><input type="file" id="school-file" accept=".json,application/json"><span id="lbl-school-in"></span></label>
    <p class="menu-note" id="school-note"></p>
    <button class="menu-item danger" id="mi-clear"></button>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<div id="sched" hidden><div class="sd" role="dialog" aria-modal="true" aria-labelledby="sd-title">
 <div class="sd-head"><h2 id="sd-title"></h2><label class="switch"><input type="checkbox" id="sd-auto"><span id="sd-auto-l"></span></label><button class="w-btn" id="sd-close" type="button"></button></div>
 <div class="sd-tabs" id="sd-tabs"></div>
 <div class="sd-body" id="sd-body"></div>
</div></div>

function mountTimer(body,w){
 const d=w.data,rt=runtime.get(w.id)||{running:false,endAt:0,lastBeep:-1};runtime.set(w.id,rt);
 const root=el("div","timer");root.style.cssText="flex:1;min-height:0;display:flex;flex-direction:column";
 const face=el("div","t-face");
 const C=2*Math.PI*44;
 face.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="t-track" cx="50" cy="50" r="44"/><circle class="t-pie" cx="50" cy="50" r="22" stroke-dasharray="'+C/2+'"/><circle class="t-arc" cx="50" cy="50" r="44" stroke-dasharray="'+C+'"/></svg>';
 const STY=["ring","pie","digital"],nextSty=()=>STY[(STY.indexOf(d.style)+1)%3];
 const arc=face.querySelector(".t-arc"),pie=face.querySelector(".t-pie"),time=el("div","t-time");time.setAttribute("role","timer");face.append(time);
 const r1=el("div","row"),r2=el("div","row");
 const bGo=chip("","go"),bReset=chip(t("reset")),bMinus=chip("−1"),bPlus=chip("+1");
 r1.append(bMinus,bGo,bReset,bPlus);
 [1,2,5,10,15,20].forEach(m=>{const b=chip(m+" "+t("min"));b.onclick=()=>{rt.running=false;d.total=d.left=m*60;paint();save();};r2.append(b);});
 const bStyle=chip(""),bSound=chip(t("sound"));r2.append(bStyle,bSound);

 function paint(){
  const s=left(),sec=Math.ceil(s),over=d.total>0&&s<=0;
  const m=Math.floor(sec/60),ss=String(sec%60).padStart(2,"0");
  time.textContent=over?t("timeout"):m+":"+ss;
  const frac=d.total?s/d.total:0;
  arc.style.strokeDashoffset=String(C*(1-frac));pie.style.strokeDashoffset=String(C/2*(1-frac));
  root.className="timer"+(d.style==="digital"?" digital":d.style==="pie"?" pie":"")+(over?" over":frac<=.1?" hot":frac<=.25?" warn":"");

function mountNames(body,w){
 const d=w.data;let view="main",spin=0;if(!Array.isArray(d.used)||d.used.some(x=>/^\d+:/.test(x)))d.used=[];

 const clsOf=()=>state.classes.find(c=>c.id===d.cls);
 const all=()=>{const c=clsOf();return c?c.names:[];};
 const pool=()=>d.noRepeat?all().filter(n=>!d.used.includes(n)):all();
 let name=null,count=null,bPick=null,last=d.last||"";
 function show(txt,cls){if(!name)return;name.textContent=txt;name.className="np-name"+(cls?" "+cls:"");}
 function state2(){
  const n=all().length;if(count)count.textContent=!n||!d.noRepeat?"":t("left")(pool().length);
  if(!bPick)return;
  if(!n){show(t("passEmptyList"),"hint");bPick.style.display="none";}
  else if(!pool().length){show(last||t("allPicked"),last?"landed":"hint");bPick.textContent=t("startOver");bPick.style.display="";}
  else{bPick.textContent=t("pick");bPick.style.display="";if(!last)show("?","");}
 }
 function pick(){
  const names=all();if(!names.length||spin)return;
  if(!pool().length){d.used=[];last=d.last="";save();state2();return;}
  const p=pool(),winner=p[Math.floor(Math.random()*p.length)];
  let n=window.matchMedia("(prefers-reduced-motion: reduce)").matches?0:14;
  const land=()=>{spin=0;last=d.last=winner;show(winner,"landed");if(d.noRepeat)d.used.push(winner);save();state2();};
  if(!n){land();return;}
  spin=setInterval(()=>{show(names[Math.floor(Math.random()*names.length)],"");if(--n<=0){clearInterval(spin);land();}},70);
 }
 function paint(){
  main.textContent="";row.textContent="";name=count=bPick=null;
  if(view==="edit"){editClasses(main,d,paint);const a=chip(t("addClass")),dn=chip(t("done"),"go");
   a.onclick=()=>{const c={id:uid(),name:"",names:[]};state.classes.push(c);if(!d.cls)d.cls=c.id;save();paint();const ins=main.querySelectorAll(".ps-edit input[type=text]");if(ins.length)ins[ins.length-1].focus();};
   dn.onclick=()=>{save();rebuild();};row.append(a,dn);return;}
  const top=el("div","ps-top");top.append(classPicker(d,()=>{d.used=[];last=d.last="";save();paint();}));
  if(state.classes.length)main.append(top);
  const bList=chip(t("classLists"));bList.onclick=()=>{view="edit";paint();};
  if(!clsOf()){main.append(el("div","hint",t("passHint")));row.append(bList);return;}
  const stage=el("div","np-stage");name=el("div","np-name");stage.append(name);main.append(stage);
  bPick=chip(t("pick"),"go");bPick.onclick=pick;

  count=el("span","np-count");row.append(bPick,bRep,bList,count);state2();
 }
 cleanups.push(()=>{if(spin)clearInterval(spin);});
 paint();
}

function mountNoise(body,w){
 const d=w.data,rt=runtime.get(w.id)||{lvl:0};runtime.set(w.id,rt);
 const N=12,root=el("div","nz"),bars=el("div","nz-bars"),msg=el("div","nz-msg");
 const segs=[];for(let i=0;i<N;i++){const b=el("div","nz-bar "+(i<7?"lo":i<10?"mid":"hi"));segs.push(b);bars.append(b);}
 function slider(label,min,max,key){const l=el("label","slide"),sp=el("span",null,label),inp=document.createElement("input");inp.type="range";inp.min=min;inp.max=max;inp.value=d[key];inp.oninput=()=>{d[key]=+inp.value;cap();save();};l.append(sp,inp);return l;}
 const row=el("div","row"),bMic=chip("","go");row.append(bMic);
 root.append(bars,msg,slider(t("sens"),1,10,"sens"),slider(t("limit"),3,12,"limit"),row);body.append(root);
 function cap(){segs.forEach((b,i)=>b.classList.toggle("cap",i===d.limit-1));}
 function label(){bMic.textContent=rt.an?t("micStop"):t("micStart");bMic.classList.toggle("go",!rt.an);}
 let raf=0,buf=null;
 function loop(){
  if(!rt.an){segs.forEach(b=>b.classList.remove("on"));root.classList.remove("loud");return;}
  buf=buf||new Uint8Array(rt.an.fftSize);rt.an.getByteTimeDomainData(buf);
  let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v;}
  const raw=clamp(Math.sqrt(sum/buf.length)*d.sens*2.4,0,1);
  rt.lvl=raw>rt.lvl?rt.lvl*.6+raw*.4:rt.lvl*.93+raw*.07;
  const lit=Math.round(rt.lvl*N),loud=lit>d.limit;
  segs.forEach((b,i)=>b.classList.toggle("on",i<lit));root.classList.toggle("loud",loud);
  msg.className="nz-msg";msg.textContent=loud?t("tooLoud"):"";
  raf=requestAnimationFrame(loop);
 }
 bMic.onclick=async()=>{
  if(rt.an){rt.dispose();label();msg.textContent="";loop();return;}
  try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   const ctx=new (window.AudioContext||window.webkitAudioContext)(),an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);
   rt.an=an;rt.dispose=()=>{try{stream.getTracks().forEach(x=>x.stop());ctx.close();}catch(e){}rt.an=null;rt.lvl=0;};
   label();loop();
  }catch(e){msg.className="nz-msg note";msg.textContent=t("micFail");}
 };
 cleanups.push(()=>cancelAnimationFrame(raf));
 cap();label();loop();
}

const toMin=x=>{const m=/^(\d{1,2}):(\d{2})$/.exec(x||"");return m?+m[1]*60+ +m[2]:null;};
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const fmtT=x=>{const m=toMin(x);if(m==null)return "";const h=Math.floor(m/60),mm=String(m%60).padStart(2,"0");return H24()?String(h).padStart(2,"0")+":"+mm:((h%12)||12)+":"+mm;};
function signSvg(go,cls){return '<svg viewBox="0 0 100 100" class="'+(cls||"")+'" role="img" aria-label="'+(go?t("goWord"):t("stopWord"))+'">'+
 (go?'<circle cx="50" cy="50" r="46" fill="#1E9E6A" stroke="#FFFFFF" stroke-width="4"/>':'<path d="M30 4h40l26 26v40L70 96H30L4 70V30z" fill="#E5484D" stroke="#FFFFFF" stroke-width="4"/>')+
 '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="Fredoka,sans-serif" font-weight="700" font-size="'+(go?32:26)+'" style="text-shadow:none">'+(go?t("goWord"):t("stopWord"))+'</text></svg>';}
function mountPlan(body,w,sign){

  if(window.claude&&typeof window.claude.use==="function"){const dl=await window.claude.use("downloads");if(!dl){toast(t("noDownload"));return;}await dl.save({filename,data});}

 const ni=head.findIndex(c=>/(name|student|öğrenci|ogrenci|isim)/.test(c));
 if(ni>=0)return rows.slice(1).map(r=>r[ni]).filter(Boolean);

 const media=Object.assign({},b.media);if(typeof b.bgImage==="string")media.bg=b.bgImage;
 for(const k of Object.keys(imgCache))delete imgCache[k];
 for(const k of Object.keys(media)){const v=media[k];if(/^(bg$|bgimg:|img:|draw:)/.test(k)&&typeof v==="string"&&v.startsWith("data:image/")){await kvSet(k,v);if(k==="bg")imgCache.bg=v;else if(k.startsWith("bgimg:"))imgCache[k.slice(6)]=v;}}
 if(imgCache.bg&&!state.bgLib.includes("bg"))state.bgLib.unshift("bg");state.bgLib=state.bgLib.filter(id=>imgCache[id]);
 if(video){await kvSet("bgv",video);if(bgVideoUrl)URL.revokeObjectURL(bgVideoUrl);bgVideoUrl=URL.createObjectURL(video);}
 disposeAll();paintChrome();rebuild();save();togglePanel(null);toast(t("restored"));
}
$("restore-file").addEventListener("change",async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{
  if(/\.zip$/i.test(f.name)||f.type.includes("zip")){
   try{await loadZip();}catch(err){toast(t("zipFail"));return;}
   const z=await window.JSZip.loadAsync(f),jf=z.file("teacher-screen.json");if(!jf)throw 0;
   const b=JSON.parse(await jf.async("string"));let video=null;
   const vf=Object.keys(z.files).find(n=>/^background-video\.\w+$/.test(n));
   if(vf){const ext=vf.split(".").pop().toLowerCase();const type=ext==="webm"?"video/webm":ext==="mov"?"video/quicktime":"video/mp4";video=new Blob([await z.file(vf).async("arraybuffer")],{type});}
   await restoreFrom(b,video);
  }else await restoreFrom(JSON.parse(await f.text()),null);
 }catch(err){toast(t("badFile"));}
});

/* ================= school settings (no student data) ================= */
function cleanForShare(widgets){
 return JSON.parse(JSON.stringify(widgets)).filter(w=>w.type!=="image"&&w.type!=="draw").map(w=>{const d=w.data;w.id=uid();
  if("cls" in d)d.cls="";if(w.type==="pass"){d.out=[];d.log=[];}if(Array.isArray(d.used))d.used=[];if("last" in d)d.last="";
  if(w.type==="groups")d.groups=[];if(w.type==="poll")(d.opts||[]).forEach(o=>o.v=0);if(w.type==="score")(d.teams||[]).forEach(x=>x.s=0);
  if(w.type==="timer")d.left=d.total;if(w.type==="stopwatch")d.ms=0;return w;});
}
$("mi-school-out").onclick=async()=>{
 togglePanel(null);
 const bells={};Object.keys(state.sched.bells).forEach(k=>{bells[k]=state.sched.bells[k].map(r=>({a:r.a,b:r.b,t:r.t||""}));});
 const data=JSON.stringify({app:"teacher-screen-school",version:1,sched:{alt:state.sched.alt,days:state.sched.days,bells},
  templates:state.templates.map(tp=>({name:tp.name,bg:tp.bg&&tp.bg.type==="preset"?tp.bg:undefined,widgets:cleanForShare(tp.widgets)}))});
 try{if(await saveOut("school-settings.json",data,"application/json"))toast(t("schoolSaved"));}catch(err){if(!err||err.code!=="declined")toast(t("noDownload"));}
};
$("school-file").addEventListener("change",async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{
  const b=JSON.parse(await f.text());if(!b||b.app!=="teacher-screen-school"||!b.sched)throw 0;
  const sc=b.sched;let nDays=0,nT=0;
  if(sc.days&&typeof sc.days==="object"){Object.keys(sc.days).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&["A","B","S"].includes(sc.days[k])){state.sched.days[k]=sc.days[k];nDays++;}});}
  if(Array.isArray(sc.alt))state.sched.alt=sc.alt.filter(d=>Number.isInteger(d)&&d>=0&&d<=6).sort();
  if(sc.bells&&typeof sc.bells==="object")Object.keys(sc.bells).forEach(k=>{if(/^[ABS][0-6]?$/.test(k)&&Array.isArray(sc.bells[k])){
   const old=state.sched.bells[k]||[];state.sched.bells[k]=sc.bells[k].filter(r=>r&&toMin(r.a)!=null&&toMin(r.b)!=null).map(r=>{const m=old.find(o=>o.t&&o.t===r.t&&o.screen);return {a:r.a,b:r.b,t:String(r.t||""),screen:m?m.screen:""};});}});
  bellKeys().forEach(k=>{if(!Array.isArray(state.sched.bells[k]))state.sched.bells[k]=[];});
  (Array.isArray(b.templates)?b.templates:[]).forEach(tp=>{if(!tp||!Array.isArray(tp.widgets))return;const ws=tp.widgets.filter(w=>w&&TYPES[w.type]&&w.data).map(w=>Object.assign(w,{id:uid()}));
   if(!ws.length||state.templates.some(x=>x.name===tp.name))return;state.templates.push({id:uid(),name:String(tp.name||t("templates")),widgets:ws,bg:tp.bg&&tp.bg.type==="preset"?tp.bg:undefined});nT++;});
  save();togglePanel(null);paintNav();toast(t("schoolLoaded")(nDays,nT));
 }catch(err){toast(t("schoolBad"));}
});

/* ================= start ================= */
loadState();
normalize();
paintChrome();rebuild();autoSwitch();
Promise.all([kvGet("bg"),kvGet("bgv")].concat(state.bgLib.filter(id=>id!=="bg").map(id=>kvGet(imgKey(id))))).then(([img,vid,...rest])=>{
 if(img){imgCache.bg=img;if(!state.bgLib.includes("bg"))state.bgLib.unshift("bg");}
 state.bgLib.filter(id=>id!=="bg").forEach((id,i)=>{if(rest[i])imgCache[id]=rest[i];});
 state.bgLib=state.bgLib.filter(id=>imgCache[id]);
 if(vid instanceof Blob)bgVideoUrl=URL.createObjectURL(vid);
 buildSwatches();applyBg();
});
window.addEventListener("pagehide",()=>{cleanups.forEach(f=>{try{f();}catch(e){}});try{localStorage.setItem(KEY,ser());}catch(e){}});
})();
</script>
<script>
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
